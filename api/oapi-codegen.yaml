# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: api
output: api.gen.go # relative to internal/api, where go generate runs
generate:
  models: true
  std-http-server: true
  strict-server: true
  client: true
  embedded-spec: true
output-options:
  skip-prune: true
